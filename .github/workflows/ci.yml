name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
      - run: npm ci
      - run: npm install --no-save --package-lock=false typescript @types/node
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
